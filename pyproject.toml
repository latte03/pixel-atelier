[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-character-pipeline"
version = "0.1.0"
description = "A whole-character pixel-art workflow, portable asset builder and technical checker."
requires-python = ">=3.9"
dependencies = ["Pillow>=10,<12"]
license = {text = "MIT"}

[project.scripts]
spritepipe = "spritepipe.__main__:main"

[tool.setuptools.packages.find]
include = ["spritepipe*"]
